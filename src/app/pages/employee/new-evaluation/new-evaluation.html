<app-header title="Nova Avaliação"></app-header>

<main class="w-full flex flex-col items-center py-8 pb-16 bg-white min-h-screen">
  <div class="w-full max-w-3xl px-4 sm:px-6 lg:px-8">

    <!-- Success Message -->
    <div *ngIf="successMessage" class="mb-6 p-4 rounded-lg bg-green-50 border border-green-200">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd" />
        </svg>
        <p class="text-green-800 font-medium">{{ successMessage }}</p>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-6 p-4 rounded-lg bg-red-50 border border-red-200">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-600" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
            clip-rule="evenodd" />
        </svg>
        <p class="text-red-800 font-medium">{{ errorMessage }}</p>
      </div>
    </div>

    <!-- Header -->
    <div class="mb-8 flex items-start justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Avaliação de Bem-estar</h1>
        <p class="text-gray-600">Por favor, responda todas as questões com honestidade.</p>
      </div>
      <button (click)="goBack()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
        ← Voltar
      </button>
    </div>

    <div *ngIf="pages.length">
      <!-- Progress Bar -->
      <div class="mb-8">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm font-medium text-gray-700">Progresso</span>
          <span class="text-sm font-medium text-yellow-600">{{ pageIndex + 1 }}/{{ pages.length }}</span>
        </div>
        <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
          <div class="h-full bg-yellow-500 transition-all duration-300"
            [style.width.%]="((pageIndex + 1) / pages.length) * 100">
          </div>
        </div>
      </div>

      <!-- Questions Card -->
      <div class="bg-white rounded-xl ring-1 ring-gray-200 shadow-lg p-8 mb-8">
        <div class="space-y-6">
          <div *ngFor="let q of pages[pageIndex]" class="pb-6 border-b border-gray-100 last:pb-0 last:border-0">
            <label class="text-gray-900 font-semibold mb-4 block text-lg leading-relaxed">
              {{ q.text }}
            </label>

            <div class="space-y-3 ml-0">
              <label *ngFor="let opt of q.options" class="flex items-start gap-3 cursor-pointer group">
                <input type="radio"
                  class="h-5 w-5 mt-0.5 text-yellow-500 border-gray-300 focus:ring-2 focus:ring-yellow-400 cursor-pointer"
                  [name]="'q' + q.id" [value]="opt.value" [(ngModel)]="answers[q.id]" />
                <span class="text-gray-700 group-hover:text-gray-900 transition-colors">
                  {{ opt.label }}
                </span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <div class="flex items-center justify-between gap-4">
        <button
          class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-all font-medium"
          (click)="prevPage()" [disabled]="pageIndex === 0">
          ← Anterior
        </button>

        <div class="text-xs font-medium text-gray-500 px-4 py-2">
          Página {{ pageIndex + 1 }} de {{ pages.length }}
        </div>

        <button *ngIf="pageIndex < pages.length - 1"
          class="px-6 py-2.5 rounded-lg bg-yellow-500 text-gray-900 hover:bg-yellow-600 disabled:opacity-40 disabled:cursor-not-allowed transition-all font-medium"
          (click)="nextPage()" [disabled]="!isPageComplete()">
          Próxima →
        </button>

        <button *ngIf="pageIndex === pages.length - 1"
          class="px-8 py-2.5 rounded-lg bg-yellow-500 text-gray-900 hover:bg-yellow-600 disabled:opacity-40 disabled:cursor-not-allowed transition-all font-medium flex items-center gap-2"
          (click)="submit()" [disabled]="!isPageComplete() || saving">
          <svg *ngIf="!saving" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20"
            fill="currentColor">
            <path fill-rule="evenodd"
              d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
              clip-rule="evenodd" />
          </svg>
          <svg *ngIf="saving" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
          <span>{{ saving ? 'A enviar…' : 'Submeter' }}</span>
        </button>
      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>
