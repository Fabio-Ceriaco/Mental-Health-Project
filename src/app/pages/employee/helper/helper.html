<app-header title="Pedido de Apoio"></app-header>

<main class="w-full flex flex-col items-center py-8 pb-16 bg-white min-h-screen">
  <div class="w-full max-w-4xl px-4 sm:px-6 lg:px-8">

    <!-- Success Message -->
    <div *ngIf="successMessage" class="mb-6 p-4 rounded-lg bg-green-50 border border-green-200">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd" />
        </svg>
        <p class="text-green-800 font-medium">{{ successMessage }}</p>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-6 p-4 rounded-lg bg-red-50 border border-red-200">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-600" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
            clip-rule="evenodd" />
        </svg>
        <p class="text-red-800 font-medium">{{ errorMessage }}</p>
      </div>
    </div>

    <div class="bg-white rounded-xl ring-1 ring-gray-200 shadow-lg p-8">
      <div class="flex justify-between items-start mb-6">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Pedido de Apoio</h1>
          <p class="text-gray-600 mt-1">Descreva como podemos ajudar. Escolha o tipo de apoio, assunto e detalhe a sua
            mensagem.</p>
        </div>
        <button (click)="goBack()"
          class="px-4 py-2 text-sm font-semibold text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
          ← Voltar
        </button>
      </div>

      <div class="space-y-8">

        <!-- Tipo de Apoio -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <label class="text-sm font-semibold text-gray-800">Tipo de Apoio (selecione uma ou mais opções)</label>
            <span class="text-xs text-gray-500">Múltipla seleção</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <label *ngFor="let s of supportOptions"
              class="flex items-center gap-3 rounded-lg border border-gray-200 px-4 py-3 text-sm text-gray-800 cursor-pointer hover:border-yellow-400 hover:bg-yellow-50 transition"
              [class.border-yellow-400]="selectedServices.includes(s)"
              [class.bg-yellow-50]="selectedServices.includes(s)">
              <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-yellow-500 focus:ring-yellow-500"
                [checked]="selectedServices.includes(s)" (change)="toggleService(s, $event.target.checked)" />
              <span class="font-medium">{{ s }}</span>
            </label>
          </div>
        </div>

        <!-- Assunto -->
        <div>
          <label class="block text-sm font-semibold text-gray-800 mb-2">Assunto</label>
          <input type="text" [(ngModel)]="subject" placeholder="Assunto"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500" />
        </div>

        <!-- Mensagem -->
        <div>
          <label class="block text-sm font-semibold text-gray-800 mb-2">Mensagem</label>
          <textarea rows="6" [(ngModel)]="message" placeholder="Descreva aqui a sua solicitação..."
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"></textarea>
        </div>

      </div>

      <!-- Actions -->
      <div class="flex justify-end mt-8 gap-3">
        <button (click)="goBack()"
          class="px-5 py-2.5 text-sm font-semibold text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
          Cancelar
        </button>
        <button (click)="submitHelp()" [disabled]="submitting"
          class="px-6 py-2.5 text-sm font-semibold text-gray-900 bg-yellow-500 rounded-lg hover:bg-yellow-600 transition disabled:opacity-60 disabled:cursor-not-allowed">
          <span *ngIf="!submitting">Submeter pedido</span>
          <span *ngIf="submitting">A enviar...</span>
        </button>
      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>
